version: "3.8"

services:
  cron:
    image: crazymax/swarm-cronjob:1.14.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=UTC
    deploy:
      mode: global

  prune-nodes:
    image: docker:27.3.1-cli
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    command: ["docker", "system", "prune", "--all", "--force"]
    deploy:
      mode: global
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.schedule=25 * * * *"
        - "swarm.cronjob.skip-running=false"
      restart_policy:
        condition: none

  mongo-rs-1:
    image: mongo:8.2.3
    command: ["bash", "-c", "echo $MONGO_RS_KEYFILE_CONTENT > /data/keyfile && chmod 400 /data/keyfile && chown 999:999 /data/keyfile && docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/keyfile --bind_ip_all"]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${PASSWORD}
      - MONGO_RS_KEYFILE_CONTENT=${MONGO_RS_KEYFILE_CONTENT}
    volumes:
      - mongodb-rs-1-data:/data/db
    networks:
      - mongo-rs-net
    deploy:
      restart_policy:
        condition: on-failure

  mongo-rs-init:
    image: mongo:8.2.3
    links:
      - mongo-rs-1
    command:
      - bash
      - -c
      - |
        echo "Waiting for mongo-rs-1 to be ready..."
        until mongosh --host mongo-rs-1 --eval "print(\"waited for connection\")"; do sleep 2; done
        echo "Initializing Replica Set..."
        mongosh --host mongo-rs-1 -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --eval 'try { rs.status() } catch (err) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo-rs-1:27017"}]}) }'
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${PASSWORD}
    networks:
      - mongo-rs-net
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5

  mongo-rs-viewer:
    image: haohanyang/compass-web:0.3.1
    environment:
      - CW_MONGO_URI=mongodb://${USERNAME}:${PASSWORD}@mongo-rs-1:27017/?replicaSet=rs0&authSource=admin
      - CW_BASIC_AUTH_USERNAME=${USERNAME}
      - CW_BASIC_AUTH_PASSWORD=${PASSWORD}
    networks:
      - mongo-rs-net
      - reverse-proxy
    deploy:
      restart_policy:
        condition: on-failure

  mongo-rs-backup-daily:
    image: ghcr.io/${OWNER_NAME}/mongo-rs-backup:${GIT_COMMIT_SHA}
    command: ["/usr/local/bin/backup.sh"]
    depends_on:
      - cron
      - mongo-rs-1
    environment:
      - S3_ENDPOINT=${S3_ENDPOINT}
      - MONGO_URI=mongodb://${USERNAME}:${PASSWORD}@mongo-rs-1:27017/?replicaSet=rs0&authSource=admin
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_FOLDER=mongo-rs-daily
    networks:
      - mongo-rs-net
    deploy:
      mode: replicated
      replicas: 0
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.schedule=30 3 * * *"
        - "swarm.cronjob.skip-running=true"
      restart_policy:
        condition: none

  mongo-rs-backup-weekly:
    image: ghcr.io/${OWNER_NAME}/mongo-rs-backup:${GIT_COMMIT_SHA}
    command: ["/usr/local/bin/backup.sh"]
    depends_on:
      - cron
      - mongo-rs-1
    environment:
      - S3_ENDPOINT=${S3_ENDPOINT}
      - MONGO_URI=mongodb://${USERNAME}:${PASSWORD}@mongo-rs-1:27017/?replicaSet=rs0&authSource=admin
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_FOLDER=mongo-rs-weekly
    networks:
      - mongo-rs-net
    deploy:
      mode: replicated
      replicas: 0
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.schedule=20 3 * * 2"
        - "swarm.cronjob.skip-running=true"
      restart_policy:
        condition: none

  postgres:
    image: postgres:18.6
    environment:
      - TZ=UTC
      - POSTGRES_USER=${USERNAME}
      - POSTGRES_PASSWORD=${PASSWORD}
      - POSTGRES_DB=postgres
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - postgres-net
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: on-failure

  pgadmin:
    image: dpage/pgadmin4:9.17
    environment:
      - TZ=UTC
      - PGADMIN_DEFAULT_EMAIL=${USERNAME}@stelmashchuk.dev
      - PGADMIN_DEFAULT_PASSWORD=${PASSWORD}
      - PGADMIN_LISTEN_PORT=5050
      - PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY=False
      # Served through caddy, so trust one hop of X-Forwarded-* headers.
      - PGADMIN_CONFIG_PROXY_X_FOR_COUNT=1
      - PGADMIN_CONFIG_PROXY_X_PROTO_COUNT=1
      - PGADMIN_CONFIG_PROXY_X_HOST_COUNT=1
      - PGADMIN_CONFIG_PROXY_X_PORT_COUNT=1
      - PGADMIN_CONFIG_PROXY_X_PREFIX_COUNT=1
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - postgres-net
      - reverse-proxy
    deploy:
      restart_policy:
        condition: on-failure

  postgres-backup-weekly:
    image: ghcr.io/${OWNER_NAME}/postgres-backup:${GIT_COMMIT_SHA}
    command: ["/usr/local/bin/backup.sh"]
    depends_on:
      - cron
      - postgres
    environment:
      - S3_ENDPOINT=${S3_ENDPOINT}
      - POSTGRES_URI=postgresql://${USERNAME}:${PASSWORD}@postgres:5432/postgres
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_FOLDER=postgres-weekly
    networks:
      - postgres-net
    deploy:
      mode: replicated
      replicas: 0
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.schedule=40 3 * * 2"
        - "swarm.cronjob.skip-running=true"
      restart_policy:
        condition: none

  caddy-backup-daily:
    image: ghcr.io/${OWNER_NAME}/caddy-backup:${GIT_COMMIT_SHA}
    command: ["/usr/local/bin/backup.sh"]
    depends_on:
      - cron
      - caddy
    environment:
      - S3_ENDPOINT=${S3_ENDPOINT}
      - CADDY_DATA_DIR=/caddy_storage
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_FOLDER=caddy-daliy
    volumes:
      - caddy-data:/caddy_storage
    deploy:
      mode: replicated
      replicas: 0
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.schedule=0 5 * * *"
        - "swarm.cronjob.skip-running=true"
      restart_policy:
        condition: none

  caddy:
    image: ghcr.io/${OWNER_NAME}/caddy:${GIT_COMMIT_SHA}
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8080:8080"
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/caddy_storage
    environment:
      - TZ=UTC
    deploy:
      update_config:
        order: start-first
      restart_policy:
        condition: on-failure
    networks:
      - reverse-proxy

  grafana:
    image: ghcr.io/${OWNER_NAME}/grafana:${GIT_COMMIT_SHA}
    links:
      - mongo-rs-1
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - TZ=UTC
      - GF_SECURITY_ADMIN_USER=${USERNAME}
      - GF_SECURITY_ADMIN_PASSWORD=${PASSWORD}
      - GF_SERVER_ROOT_URL=https://grafana.stelmashchuk.dev
    deploy:
      update_config:
        order: start-first
      restart_policy:
        condition: on-failure
    networks:
      - reverse-proxy
      - mongo-rs-net
      - logs-net

  grafana-backup-daily:
    image: ghcr.io/${OWNER_NAME}/grafana-backup:${GIT_COMMIT_SHA}
    command: ["/usr/local/bin/backup.sh"]
    depends_on:
      - cron
      - grafana
    environment:
      - S3_ENDPOINT=${S3_ENDPOINT}
      - GRAFANA_DATA_DIR=/var/lib/grafana/grafana.db
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_FOLDER=grafana-daily
    volumes:
      - grafana-data:/var/lib/grafana
    deploy:
      mode: replicated
      replicas: 0
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.schedule=0 6 * * *"
        - "swarm.cronjob.skip-running=true"
      restart_policy:
        condition: none

  loki-init:
    image: alpine:3.21
    # Loki runs as uid 10001 but docker creates the loki-data volume as root,
    # and the loki image is distroless so it cannot fix that itself. This
    # one-shot task prepares the data directories on every deploy. Same idea
    # as mongo-rs-init above.
    command:
      - sh
      - -c
      - |
        mkdir -p /loki/chunks /loki/rules /loki/rules-temp /loki/compactor /loki/wal
        chown -R 10001:10001 /loki
        echo "loki data dir ready"
    volumes:
      - loki-data:/loki
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: none

  loki:
    image: ghcr.io/${OWNER_NAME}/loki:${GIT_COMMIT_SHA}
    # Log storage for the whole swarm. Not published through caddy, only
    # grafana and the alloy collectors talk to it over logs-net.
    depends_on:
      - loki-init
    volumes:
      - loki-data:/loki
    environment:
      - TZ=UTC
    networks:
      - logs-net
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 1G

  alloy:
    image: ghcr.io/${OWNER_NAME}/alloy:${GIT_COMMIT_SHA}
    # Collects the logs of every container on the node and pushes them to loki.
    hostname: "{{.Node.Hostname}}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
      - /:/rootfs:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /sys:/sys:ro
    environment:
      - TZ=UTC
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
    networks:
      - logs-net
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 512M

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-remote-write-receiver'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - prometheus-data:/prometheus
    networks:
      - logs-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M

secrets:
  dozzle_users:
    external: true

networks:
  reverse-proxy:
    driver: overlay
    attachable: true
  mongo-rs-net:
    driver: overlay
    attachable: true
    driver_opts:
      encrypted: "true"
  postgres-net:
    driver: overlay
    attachable: true
    driver_opts:
      encrypted: "true"
  logs-net:
    driver: overlay
    attachable: true
    driver_opts:
      encrypted: "true"

volumes:
  mongodb-rs-1-data:
  postgres-data:
  pgadmin-data:
  grafana-data:
  caddy-data:
  loki-data:
  alloy-data:
  prometheus-data:
