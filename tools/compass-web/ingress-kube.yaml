apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: compass-web-kube
  namespace: infra
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - compass.kube.stelmashchuk.dev
      secretName: compass-kube-tls
  rules:
    - host: compass.kube.stelmashchuk.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: compass-web
                port:
                  number: 8080
