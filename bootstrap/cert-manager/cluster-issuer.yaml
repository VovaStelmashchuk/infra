# Let's Encrypt production issuer, solving the HTTP-01 challenge through the
# built-in Traefik ingress. cert-manager itself is installed once during
# bootstrap (see ../README.md) — this issuer is then applied by the deploy
# workflow along with the rest of the manifests.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: vovochkastelmashchuk@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
