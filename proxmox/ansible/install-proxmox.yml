- name: Install Proxmox VE on Debian
  hosts: all
  become: yes

  vars:
    proxmox_release: bookworm
    proxmox_repo_url: "http://download.proxmox.com/debian/pve"
    proxmox_gpg_key_url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
    proxmox_gpg_key_path: "/etc/apt/trusted.gpg.d/proxmox-release-bookworm.gpg"

  tasks:
    - name: Verify Debian Bookworm is the base OS
      fail:
        msg: "This playbook requires Debian 12 (Bookworm). Found: {{ ansible_distribution }} {{ ansible_distribution_version }}"
      when: ansible_distribution != "Debian" or ansible_distribution_major_version != "12"

    - name: Set hostname to FQDN
      hostname:
        name: "{{ proxmox_hostname }}"

    - name: Resolve the server IP from the inventory host
      set_fact:
        server_ip: "{{ ansible_host | default(inventory_hostname) }}"

    - name: Configure /etc/hosts with FQDN and short hostname
      blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED - Proxmox hostname"
        block: |
          {{ server_ip }}  {{ proxmox_hostname }}  {{ proxmox_hostname.split('.')[0] }}

    - name: Download Proxmox GPG key
      get_url:
        url: "{{ proxmox_gpg_key_url }}"
        dest: "{{ proxmox_gpg_key_path }}"
        mode: "0644"

    - name: Add Proxmox VE no-subscription repository
      apt_repository:
        repo: "deb [arch=amd64] {{ proxmox_repo_url }} {{ proxmox_release }} pve-no-subscription"
        filename: pve-install-repo
        state: present

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Full system upgrade before Proxmox install
      apt:
        upgrade: full

    - name: Install Proxmox VE packages
      apt:
        name:
          - proxmox-ve
          - postfix
          - open-iscsi
          - chrony
        state: present

    - name: Remove default Debian kernel (optional cleanup)
      apt:
        name:
          - linux-image-amd64
          - "linux-image-6*"
          - os-prober
        state: absent
        purge: yes
      ignore_errors: yes

    - name: Update GRUB after kernel changes
      command: update-grub
      changed_when: true

    - name: Display post-install summary
      debug:
        msg:
          - "Proxmox VE installation complete."
          - "The server will now reboot."
          - "After reboot, access the web UI at: https://{{ server_ip }}:8006"
          - "Login with your root credentials."

    - name: Reboot the server to boot into Proxmox kernel
      reboot:
        msg: "Rebooting into Proxmox VE kernel"
        reboot_timeout: 300
