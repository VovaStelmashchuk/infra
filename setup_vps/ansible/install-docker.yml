---
- name: Install Docker on Ubuntu
  vars:
    docker_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"

  hosts: all
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    # apt-key is removed in newer Ubuntu releases, so store the key in a keyring
    # file and reference it from a deb822 sources file via Signed-By.
    - name: Create apt keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker repository
      copy:
        dest: /etc/apt/sources.list.d/docker.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_facts['distribution_release'] }}
          Components: stable
          Architectures: {{ docker_arch }}
          Signed-By: /etc/apt/keyrings/docker.asc

    - name: Update apt cache after adding repository
      apt:
        update_cache: yes

    - name: Install Docker CE
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Initialize Docker Swarm
      command: docker swarm init
      register: swarm_result
      changed_when: "'Swarm initialized' in swarm_result.stdout"
      failed_when: "swarm_result.rc != 0 and 'This node is already part of a swarm' not in swarm_result.stderr"

    - name: Verify Docker installation
      command: docker --version
      register: docker_version_output
      changed_when: false

    - name: Display Docker version
      debug:
        msg: "Docker version: {{ docker_version_output.stdout }}"
    
    - name: Get Docker nodes
      command: docker node ls
      register: docker_nodes
      changed_when: false

    - name: Display Docker nodes
      debug:
        msg: "{{ docker_nodes.stdout_lines }}"
